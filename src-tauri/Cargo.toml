[package]
name = "stockroom"
version = "0.38.0"
description = "A local stockroom for everything you collect"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stockroom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: a transparent window on macOS, for the sidebar's
# translucent material (lib.rs, `main_window`).
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
sha2 = "0.11.0"
rayon = "1.12.0"
walkdir = "2.5.0"
hex = "0.4.3"
uuid = { version = "1.27.0", features = ["v4"] }
tauri-plugin-dialog = "2.8.1"
clipboard-rs = "0.3.5"
tauri-plugin-drag = "2.1.1"
resvg = "0.48"
# Fonts: metadata / character map (already used by resvg), WOFF / WOFF2 unpacking.
skrifa = "0.44"
woff2-patched = "0.4"
# Checking a WOFF2 file's sizes before woff2-patched unpacks it (fonts/mod.rs).
brotli = { version = "7", default-features = false, features = ["std"] }
flate2 = "1"
tempfile = "3.27.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Local HTTP servers for the browser extension (webimport.rs) and Claude (mcp/).
tiny_http = "0.12"
# Images handed to Claude (mcp/tools.rs).
base64 = "0.22"
# Texts: reading and writing Shift_JIS (CSV from Excel and in-house systems), texts/mod.rs.
encoding_rs = "0.8"
# Files: the preview inside iWork / Office files (files/mod.rs). Reading only.
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
# The window opens at the size and place it had when last closed.
tauri-plugin-window-state = "2"
# A second launch brings up the running app's window instead (lib.rs).
tauri-plugin-single-instance = "2"
# Warnings and errors into a file in the app's log folder (lib.rs, src/lib/log.ts).
tauri-plugin-log = "2"
log = "0.4"
# OS notifications for long tasks that end while the user is away (src/lib/osNotify.ts).
tauri-plugin-notification = "2"
# Sharing a folder on the local network (share.rs): this PC's addresses for
# the URL, and the URL as a QR code for phones.
if-addrs = "0.15"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
# Thin LTO with the default 16 codegen units instead of fat LTO + 1 unit:
# measured on an M-series Mac, a rebuild with cached dependencies drops from
# 93 s to 36 s (from scratch 159 s -> 102 s). The binary grows 9.8 -> 12.2 MB,
# about +0.5 MB once compressed in the installer.
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Imaging", "Win32_System_Com", "Win32_Foundation", "Win32_Networking_WinHttp", "Data_Pdf", "Storage_Streams"] }

# System proxy lookup (PAC) for the updater, see proxy.rs.
[target."cfg(target_os = \"macos\")".dependencies]
core-foundation-sys = "0.8"
