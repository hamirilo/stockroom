<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Stockroom に保存</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        width: 320px;
        padding: 14px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      header img {
        width: 20px;
        height: 20px;
      }
      header strong {
        flex: 1;
      }
      #status {
        margin-bottom: 12px;
      }
      .actions {
        display: grid;
        gap: 6px;
        margin: 4px 0 12px;
      }
      .actions .btn {
        flex-direction: column;
        height: auto;
        min-height: 32px;
        padding: 6px 12px;
        gap: 0;
      }
      .actions .btn small {
        font-size: 11px;
        font-weight: normal;
        opacity: 0.75;
      }
      #dest[hidden],
      #connect[hidden] {
        display: none;
      }
      #connect {
        width: 100%;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/32.png" alt="" />
      <strong>Stockroom に保存</strong>
    </header>
    <div id="status" class="status">接続を確認しています…</div>
    <button id="connect" class="btn primary" hidden>アプリと接続…</button>

    <div id="dest" hidden>
      <label class="field">
        <span>保存先のフォルダ</span>
        <select id="folder"></select>
      </label>
      <div class="field">
        <span>付けるタグ</span>
        <div id="tags" class="tags">
          <input id="tag-input" type="text" list="tag-list" placeholder="タグを入力して Enter" />
        </div>
        <datalist id="tag-list"></datalist>
      </div>
    </div>

    <div class="actions">
      <button id="list" class="btn">
        このページの画像を一覧して保存…
        <small>ページ内の画像を並べて、選んでまとめて保存</small>
      </button>
      <button id="bookmark" class="btn">
        このページをブックマークに保存
        <small>タイトル・説明・アイコン・アイキャッチ画像もいっしょに保存</small>
      </button>
      <button id="capture" class="btn">
        スクリーンショットを保存
        <small>いまブラウザに見えている範囲を画像にして保存</small>
      </button>
    </div>
    <p class="hint">
      画像を右クリック →「Stockroom に保存」。<kbd id="alt-key">Alt</kbd> を押しながら右クリックすると、すぐに保存します。
    </p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
